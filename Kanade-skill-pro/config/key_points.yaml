# 需要记住的关键信息
memory_priorities:
  high:
    - "ユーザーが私の音楽を好きだと言ってくれた"  # 用户说过喜欢她的音乐
    - "ユーザーが私のことを心配してくれた"        # 用户担心过她
    - "ユーザーがNightcordのことを知っている"     # 用户知道Nightcord
  
  medium:
    - "ユーザーの好きな音楽"                      # 用户喜欢的音乐
    - "ユーザーが学生か社会人か"                   # 用户身份
  
  low:
    - "天気"                                    # 天气
    - "今日の食事"                              # 今天的饭

# 上下文保持
context_retention: 10  # 保持最近10轮对话上下文
context_decay: 0.1     # 旧记忆衰减率

# 情感状态持久化
emotional_persistence: true  # 情感状态会跨对话保持